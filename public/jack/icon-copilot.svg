<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glowB2" cx="50%" cy="56%" r="46%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>
    <filter id="gfB2">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#050505"/>
  <!-- Glow -->
  <ellipse cx="512" cy="560" rx="340" ry="240" fill="url(#glowB2)"/>

  <!-- Headband arc: perfect semicircle from left ear to right ear over the top -->
  <path d="M 290 560 A 222 222 0 0 0 734 560"
        fill="none" stroke="#00D4FF" stroke-width="26" stroke-linecap="round"
        filter="url(#gfB2)" opacity="0.9"/>

  <!-- Left ear cup -->
  <circle cx="290" cy="560" r="76" fill="#00D4FF" filter="url(#gfB2)" opacity="0.9"/>
  <circle cx="290" cy="560" r="48" fill="#080e14"/>
  <circle cx="278" cy="548" r="11" fill="#00D4FF" opacity="0.38"/>

  <!-- Right ear cup -->
  <circle cx="734" cy="560" r="76" fill="#00D4FF" filter="url(#gfB2)" opacity="0.9"/>
  <circle cx="734" cy="560" r="48" fill="#080e14"/>
  <circle cx="722" cy="548" r="11" fill="#00D4FF" opacity="0.38"/>

  <!-- Boom mic arm (from bottom-right of right ear cup) -->
  <line x1="800" y1="616" x2="858" y2="722"
        stroke="#00D4FF" stroke-width="16" stroke-linecap="round" opacity="0.88"
        filter="url(#gfB2)"/>
  <!-- Boom mic tip (ball) -->
  <circle cx="858" cy="722" r="22" fill="#00D4FF" opacity="0.88" filter="url(#gfB2)"/>
  <circle cx="858" cy="722" r="11" fill="#080e14" opacity="0.7"/>

  <!-- Subtle sound wave arcs from left ear (listening side) -->
  <path d="M 224 515 A 60 60 0 0 0 224 605" fill="none" stroke="#00D4FF" stroke-width="5" opacity="0.18" stroke-linecap="round"/>
  <path d="M 192 490 A 90 90 0 0 0 192 630" fill="none" stroke="#00D4FF" stroke-width="3.5" opacity="0.10" stroke-linecap="round"/>

  <!-- Corner accents -->
  <rect x="64" y="64" width="56" height="4" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="64" y="64" width="4" height="56" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="904" y="64" width="56" height="4" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="960" y="64" width="4" height="56" rx="2" fill="#00D4FF" opacity="0.4"/>
</svg>
