<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glowB3" cx="50%" cy="44%" r="46%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.16"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>
    <filter id="gfB3">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bubbleClip">
      <rect x="140" y="185" width="744" height="440" rx="60"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#050505"/>
  <ellipse cx="512" cy="420" rx="380" ry="250" fill="url(#glowB3)"/>

  <!-- Bubble body fill -->
  <rect x="140" y="185" width="744" height="440" rx="60" fill="#0a1520"/>

  <!-- Waveform bars inside bubble (bell-curve heights, clipped) -->
  <g clip-path="url(#bubbleClip)">
    <rect x="316" y="365" width="44" height="80"  rx="8" fill="#00D4FF" opacity="0.9"/>
    <rect x="374" y="335" width="44" height="140" rx="8" fill="#00D4FF" opacity="0.9"/>
    <rect x="432" y="305" width="44" height="200" rx="8" fill="#00D4FF" opacity="0.9"/>
    <rect x="490" y="275" width="44" height="260" rx="8" fill="#00D4FF" opacity="0.9"/>
    <rect x="548" y="305" width="44" height="200" rx="8" fill="#00D4FF" opacity="0.9"/>
    <rect x="606" y="335" width="44" height="140" rx="8" fill="#00D4FF" opacity="0.9"/>
    <rect x="664" y="365" width="44" height="80"  rx="8" fill="#00D4FF" opacity="0.9"/>
  </g>

  <!-- Bubble border (drawn after bars so it's on top) -->
  <rect x="140" y="185" width="744" height="440" rx="60"
        fill="none" stroke="#00D4FF" stroke-width="7" filter="url(#gfB3)" opacity="0.9"/>

  <!-- Tail triangle (centered bottom) -->
  <polygon points="466,621 512,728 558,621" fill="#0a1520"/>
  <!-- Cover strip — erases bubble border between tail base points -->
  <rect x="467" y="615" width="90" height="14" fill="#0a1520"/>
  <!-- Tail outline sides only -->
  <path d="M 466 625 L 512 728 L 558 625"
        fill="none" stroke="#00D4FF" stroke-width="7" stroke-linejoin="round"
        filter="url(#gfB3)" opacity="0.9"/>

  <!-- Corner accents -->
  <rect x="64" y="64" width="56" height="4" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="64" y="64" width="4" height="56" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="904" y="64" width="56" height="4" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="960" y="64" width="4" height="56" rx="2" fill="#00D4FF" opacity="0.4"/>
</svg>
