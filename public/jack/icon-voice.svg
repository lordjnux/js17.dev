<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glowB1" cx="50%" cy="47%" r="38%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </radialGradient>
    <filter id="gfB1">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#050505"/>
  <!-- Glow halo -->
  <ellipse cx="512" cy="385" rx="270" ry="230" fill="url(#glowB1)"/>

  <!-- Waveform bars — left side, closest to farthest -->
  <rect x="330" y="265" width="28" height="240" rx="14" fill="#00D4FF" opacity="0.30"/>
  <rect x="284" y="290" width="28" height="190" rx="14" fill="#00D4FF" opacity="0.22"/>
  <rect x="238" y="315" width="28" height="140" rx="14" fill="#00D4FF" opacity="0.16"/>
  <rect x="192" y="345" width="28" height="80"  rx="14" fill="#00D4FF" opacity="0.10"/>

  <!-- Waveform bars — right side -->
  <rect x="666" y="265" width="28" height="240" rx="14" fill="#00D4FF" opacity="0.30"/>
  <rect x="712" y="290" width="28" height="190" rx="14" fill="#00D4FF" opacity="0.22"/>
  <rect x="758" y="315" width="28" height="140" rx="14" fill="#00D4FF" opacity="0.16"/>
  <rect x="804" y="345" width="28" height="80"  rx="14" fill="#00D4FF" opacity="0.10"/>

  <!-- Mic body (capsule) -->
  <rect x="422" y="240" width="180" height="290" rx="90" fill="#00D4FF" filter="url(#gfB1)"/>

  <!-- Mic grille lines -->
  <rect x="440" y="365" width="144" height="5" rx="2.5" fill="#050505" opacity="0.28"/>
  <rect x="436" y="395" width="152" height="5" rx="2.5" fill="#050505" opacity="0.28"/>
  <rect x="440" y="425" width="144" height="5" rx="2.5" fill="#050505" opacity="0.28"/>
  <rect x="436" y="455" width="152" height="5" rx="2.5" fill="#050505" opacity="0.28"/>

  <!-- Stand collar arc -->
  <path d="M 408 530 C 408 638 616 638 616 530"
        fill="none" stroke="#00D4FF" stroke-width="22" stroke-linecap="round" opacity="0.88"/>
  <!-- Stand pole -->
  <rect x="499" y="638" width="26" height="86" rx="13" fill="#00D4FF" opacity="0.88"/>
  <!-- Stand base -->
  <rect x="384" y="724" width="256" height="18" rx="9" fill="#00D4FF" opacity="0.88"/>

  <!-- Corner accents -->
  <rect x="64" y="64" width="56" height="4" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="64" y="64" width="4" height="56" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="904" y="64" width="56" height="4" rx="2" fill="#00D4FF" opacity="0.4"/>
  <rect x="960" y="64" width="4" height="56" rx="2" fill="#00D4FF" opacity="0.4"/>
</svg>
